server:
  port: 8081

spring:

  application:
    name: user
  datasource:
    url: jdbc:mysql://localhost:3306/swapbox_user_db?createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: 9a2f8c4e7b1d3f6a8e0c2b5d7a9f1e3c8b6d4a2f0e9c7b5a3d1f8e6c4b2a0f9e
  expiration: 86400000 # 24 hours in milliseconds


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true