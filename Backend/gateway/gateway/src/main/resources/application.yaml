server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER
              predicates:
                - Path=/users/**

            - id: resource-service
              uri: lb://RESOURCES
              predicates:
                - Path=/resources/**

            - id: credit-service
              uri: lb://CREDITS
              predicates:
                - Path=/credits/**

            - id: exchange-service
              uri: lb://EXCHANGE
              predicates:
                - Path=/exchange/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: 9a2f8c4e7b1d3f6a8e0c2b5d7a9f1e3c8b6d4a2f0e9c7b5a3d1f8e6c4b2a0f9e



logging:
  level:
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: DEBUG
    org.springframework.cloud.gateway: DEBUG


management:
  endpoints:
    web:
      exposure:
        include: gateway